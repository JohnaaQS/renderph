<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseMind - Log in</title>
    <link rel="stylesheet" href="css/auth-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-split-container">
        <!-- Left Side - Login Form -->
        <div class="auth-form-side">
            <div class="auth-logo">
                <i class="fas fa-fingerprint"></i>
            </div>
            
            <div class="auth-form-wrapper">
                <h1 class="auth-title">Log in</h1>
                <p class="auth-description">Welcome back! Please enter your details</p>
                <p class="auth-description" id="status" style="display: none;"></p>
                
                <form class="modern-auth-form" id="login-form">
                    <div class="modern-form-group">
                        <label for="login-identifier">Email or username</label>
                        <input type="text" id="login-identifier" placeholder="Enter your email or username" required>
                    </div>
                    
                    <div class="modern-form-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-modern" id="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="modern-btn-primary">
                        <i class="fas fa-fingerprint"></i> Sign in
                    </button>
                    
                    <button type="button" class="modern-btn-secondary" onclick="window.location.href='signup.html'">
                        <i class="fas fa-user-plus"></i> Sign up
                    </button>
                    
                    <div class="auth-footer-link">
                        <p>Trouble signing in? <a href="#" class="reset-link">Reset password</a></p>
                    </div>
                </form>

                <div id="twofa-section" style="display: none;">
                    <p class="auth-description" id="twofa-message">
                        We sent a verification code to your email. Enter it below.
                    </p>
                    <form class="modern-auth-form" id="twofa-form">
                        <div class="modern-form-group">
                            <label for="twofa-code">Verification code</label>
                            <input
                                type="text"
                                id="twofa-code"
                                inputmode="numeric"
                                autocomplete="one-time-code"
                                maxlength="6"
                                placeholder="123456"
                                required
                            >
                        </div>
                        <button type="submit" class="modern-btn-primary" id="twofa-submit">
                            <i class="fas fa-shield-alt"></i> Verify code
                        </button>
                        <button type="button" class="modern-btn-secondary" id="twofa-cancel">
                            <i class="fas fa-arrow-left"></i> Back
                        </button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="auth-gradient-side"></div>
    </div>

    <script src="js/api-base.js" defer></script>
    <script src="js/app.js" defer></script>
    <script>
        // Password toggle
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        
        // Reset password link
        document.querySelector('.reset-link').addEventListener('click', function(e) {
            e.preventDefault();
            const email = prompt('Enter your email address for password reset:');
            if (email && email.includes('@')) {
                alert(`Password reset instructions have been sent to ${email}`);
            } else if (email) {
                alert('Please enter a valid email address');
            }
        });
    </script>
</body>
</html>
