<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseMind - Sign up</title>
    <link rel="stylesheet" href="css/auth-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-split-container">
        <!-- Left Side - Signup Form -->
        <div class="auth-form-side">
            <div class="auth-logo">
                <i class="fas fa-fingerprint"></i>
            </div>
            
            <div class="auth-form-wrapper">
                <h1 class="auth-title">Sign up</h1>
                <p class="auth-description">Sign up for your account</p>
                <p class="auth-description" id="status" style="display: none;"></p>
                
                <form class="modern-auth-form" id="signup-form">
                    <div class="modern-form-group">
                        <label for="signup-username">Username</label>
                        <input type="text" id="signup-username" placeholder="Choose a username" required>
                    </div>
                    
                    <div class="modern-form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="modern-form-group">
                        <label for="signup-password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="signup-password" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-modern" id="toggle-signup-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span class="password-hint">Must be at least 8 characters</span>
                    </div>

                    <div class="modern-form-group">
                        <label for="signup-password-confirm">Confirm password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="signup-password-confirm" placeholder="••••••••" required>
                            <button type="button" class="password-toggle-modern" id="toggle-signup-password-confirm">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="modern-btn-primary">
                        <i class="fas fa-user-plus"></i> Sign up
                    </button>
                    
                    <button type="button" class="modern-btn-secondary" onclick="window.location.href='login.html'">
                        <i class="fas fa-fingerprint"></i> Sign in
                    </button>
                </form>

                <div id="twofa-section" style="display: none;">
                    <p class="auth-description" id="twofa-message">
                        We sent a verification code to your email. Enter it below.
                    </p>
                    <p class="auth-description" id="device-key-output" style="display: none;"></p>
                    <p class="auth-description" id="device-key-note" style="display: none;">
                        Bewaar deze goed, dit is uw unieke code.
                    </p>
                    <form class="modern-auth-form" id="twofa-form">
                        <div class="modern-form-group">
                            <label for="twofa-code">Verification code</label>
                            <input
                                type="text"
                                id="twofa-code"
                                inputmode="numeric"
                                autocomplete="one-time-code"
                                maxlength="6"
                                placeholder="123456"
                                required
                            >
                        </div>
                        <button type="submit" class="modern-btn-primary" id="twofa-submit">
                            <i class="fas fa-shield-alt"></i> Verify code
                        </button>
                        <button type="button" class="modern-btn-secondary" id="twofa-cancel">
                            <i class="fas fa-arrow-left"></i> Back
                        </button>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Right Side - Gradient Background with Avatar -->
        <div class="auth-gradient-side">
        </div>
    </div>

    <script src="js/api-base.js" defer></script>
    <script src="js/app.js" defer></script>
    <script>
        // Password toggles
        function bindPasswordToggle(toggleId, inputId) {
            const toggle = document.getElementById(toggleId);
            const input = document.getElementById(inputId);
            if (!toggle || !input) return;

            toggle.addEventListener('click', function() {
                const icon = this.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        }

        bindPasswordToggle('toggle-signup-password', 'signup-password');
        bindPasswordToggle('toggle-signup-password-confirm', 'signup-password-confirm');
    </script>
</body>
</html>
