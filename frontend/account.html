<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseMind - My Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/profile-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="header">
    <a href="dashboard.html" class="logo" aria-label="Go to dashboard">
        <img
            src="images/icons/PulseMind.png"
            alt="PulseMind logo"
            class="logo-icon"
        >
    </a>



    <!-- Navigatiemenu -->
    <nav class="nav">
      <!-- Actieve pagina: Dashboard -->
      <a href="dashboard.html" class="nav-btn active">
        <img src="images/icons/icon-dashboard.svg" alt="">
        Dashboard
      </a>

      <!-- Link naar dagelijkse check-in -->
      <a href="checklist.html" class="nav-btn">
        <img src="images/icons/icon-daily_check_in.svg" alt="">
        Daily Check-in
      </a>

      <!-- Link naar profielpagina -->
      <a href="account.html" class="nav-btn">
        <img src="images/icons/icon-profile.svg" alt="">
        Profile
      </a>
    </nav>
  </header>


    <!-- Main Content -->
    <main class="profile-main">
        
            <!-- Title Section -->
            <div class="profile-header">
                <h1>My Profile</h1>
                <p>View and update your personal info to get accurate health insights.</p>
            </div>
            
            <div class="profile-container">
            <!-- Profile Form -->
            <form class="profile-form" id="profile-form">
                <!-- Email and Password Row -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" value="thijskraayvanger@outlook.com" disabled>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-field">
                            <input type="password" id="password" value="••••••••" disabled>
                            <button type="button" class="eye-btn">
                                <i class="fas fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Birth Date -->
                <div class="form-group">
                    <label for="birth-date">Birth date</label>
                    <input type="date" id="birth-date" value="2004-03-21">
                </div>

                <!-- First and Last Name -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First name</label>
                        <input type="text" id="first-name" value="Thijs" placeholder="First name">
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last name</label>
                        <input type="text" id="last-name" value="Kraaijvanger" placeholder="Last name">
                    </div>
                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="gender" value="man" checked>
                            <span class="radio-btn"></span>
                            Man
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="gender" value="woman">
                            <span class="radio-btn"></span>
                            Vrouw
                        </label>
                    </div>
                </div>

                <!-- Height, Weight, BMI -->
                <div class="form-row-three">
                    <div class="form-group">
                        <label for="height">Height (cm)</label>
                        <div class="input-with-unit">
                            <input type="number" id="height" value="180" placeholder="170">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="weight">Weight (kg)</label>
                        <div class="input-with-unit">
                            <input type="number" id="weight" value="80" placeholder="70">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>BMI (auto)</label>
                        <div class="bmi-display">
                            <i class="fas fa-lock"></i>
                            <span id="bmi-value">20.1</span>
                        </div>
                    </div>
                </div>

                <!-- Activity Life -->
                <div class="form-group">
                    <label>Activity Life</label>
                    <div class="activity-buttons">
                        <button type="button" class="activity-btn" data-activity="sedentary">
                            <i class="fas fa-couch"></i> Sedentary
                        </button>
                        <button type="button" class="activity-btn active" data-activity="light">
                            <i class="fas fa-walking"></i> Light active
                        </button>
                        <button type="button" class="activity-btn" data-activity="moderate">
                            <i class="fas fa-running"></i> Moderate
                        </button>
                        <button type="button" class="activity-btn" data-activity="active">
                            <i class="fas fa-dumbbell"></i> Active
                        </button>
                    </div>
                </div>

                <!-- Average Daily Sleep -->
                <div class="form-group">
                    <label>Average Daily Sleep (hours)</label>
                    <div class="sleep-slider-container">
                        <input
                            type="range"
                            class="sleep-slider"
                            id="sleep-slider"
                            min="1"
                            max="12"
                            value="6"
                            step="1"
                        >

                        <!-- Waardes onder de slider -->
                        <div class="sleep-scale">
                            <span>1</span>
                            <span>2</span>
                            <span>3</span>
                            <span>4</span>
                            <span>5</span>
                            <span>6</span>
                            <span>7</span>
                            <span>8</span>
                            <span>9</span>
                            <span>10</span>
                            <span>11</span>
                            <span>12</span>
                        </div>
                    </div>
                </div>

                <!-- Save Button -->
                <button type="submit" class="save-btn">
                    <i class="fas fa-save"></i> Save Changes
                </button>

                <!-- Logout Button -->
                <button type="button" class="logout-btn" id="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Log out
                </button>

                <!-- Privacy Note -->
                <p class="privacy-note">
                    Your data is secure and only used to personalize your experience. read our <a href="#">Privacy Policy</a>
                </p>
            </form>
        </div>
    </main>

    <script src="js/profile.js"></script>
</body>
</html>
